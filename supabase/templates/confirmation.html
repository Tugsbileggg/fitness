<!doctype html>
<html lang="mn">
  <body style="margin:0;padding:24px;background:#f4f7f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933">
    <table role="presentation" width="100%" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px">
      <tr>
        <td>
          <h1 style="margin:0 0 16px;font-size:22px;color:#0f766e">Фитнес Хяналт</h1>
          <p style="font-size:16px;line-height:1.6;margin:0 0 16px">Сайн байна уу,</p>
          <p style="font-size:16px;line-height:1.6;margin:0 0 24px">
            Таны фитнесийн бүртгэл амжилттай үүслээ. Доорх товч дээр дарж имэйл хаягаа баталгаажуулна уу.

          </p>
          <p style="font-size:13px;line-height:1.6;color:#6b7280;margin:0">
            Хэрэв та бүртгүүлээгүй бол энэ имэйлийг үл тоомсорлоно уу.
          </p>
        </td>
      </tr>
    </table>
